name: CI

on:
  push: { branches: [main] }
  pull_request:

# Silences "Node.js 20 actions are deprecated" warnings emitted by pnpm/action-setup@v4
# and supabase/setup-cli@v1 (no v5 published yet for these). Forces them to run on
# Node 24 instead. Safe — these are JS actions with no Node 20 dependencies.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: supabase start
      - name: Capture env
        run: |
          # Eval supabase env in the current shell so we can read $API_URL etc.
          # GITHUB_ENV vars only become visible to *subsequent* steps, so doing
          # this in two steps would still leave them undefined here.
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm test:rls
      - if: always()
        run: supabase stop

  scan-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build with placeholder env
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://placeholder.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          APP_ORIGIN: http://placeholder.test
          SMTP_HOST: smtp.placeholder.test
          SMTP_PORT: '587'
          SMTP_SECURE: 'false'
          SMTP_USER: placeholder
          SMTP_PASSWORD: placeholder
          SMTP_FROM: placeholder
        run: pnpm build
      - run: pnpm scan-bundle
